<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native App Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0B2338;
    --navy:#14365A;
    --navy-elev:#EEF1F4;
    --navy-card:#FFFFFF;
    --ice:#57677B;
    --muted:#8791A0;
    --white:#FFFFFF;
    --text:#0F2439;
    --accent:#E8825F;
    --accent-deep:#C25F3D;
    --pine:#3F7A5C;
    --line:rgba(15,36,57,.10);
    --danger:#D1573A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#EDEFF3;font-family:'Noto Sans JP',sans-serif;color:var(--text);}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 16px 64px;}
  .lab{font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;}
  .hint{max-width:390px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6;}
  .hint b{color:var(--accent);}

  .phone{
    width:390px;max-width:92vw;height:844px;max-height:88vh;
    background:var(--navy-elev);border-radius:44px;border:8px solid #030B14;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#030B14;border-radius:0 0 16px 16px;z-index:60;}
  .statusbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:var(--text);}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;display:flex;flex-direction:column;}
  .screen::-webkit-scrollbar{display:none;}
  .fade{animation:fadein .22s ease;display:flex;flex-direction:column;flex:1;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .topbar{padding:2px 18px 16px;display:flex;align-items:center;justify-content:space-between;min-height:44px;}
  .topbar .left{display:flex;align-items:center;gap:10px;}
  .backbtn{width:30px;height:30px;border-radius:50%;background:rgba(15,36,57,.06);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
  .backbtn svg{width:15px;height:15px;stroke:var(--text);}
  .screentitle{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em;}
  .mark{width:32px;height:32px;border-radius:9px;background:var(--navy);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
  .mark svg{width:16px;height:16px;stroke:#FFFFFF;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-card);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;}

  .warnbanner{margin:0 18px 14px;padding:10px 13px;border-radius:10px;background:rgba(225,132,107,.14);border:1px solid rgba(225,132,107,.4);color:#A8432B;font-size:11.5px;display:flex;gap:8px;align-items:center;cursor:pointer;}
  .warnbanner svg{width:16px;height:16px;stroke:#A8432B;flex:none;}
  .warnbanner b{color:var(--text);}

  .section-title{font-family:'Poppins',sans-serif;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 18px;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title a{color:var(--accent);font-size:11px;letter-spacing:0;text-transform:none;text-decoration:none;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;}

  .card{background:var(--navy-card);border:1px solid var(--line);border-radius:16px;}
  .tap{cursor:pointer;transition:transform .12s ease, background .12s ease;}
  .tap:active{transform:scale(.97);background:var(--navy-elev);}

  /* HOME */
  .ascent-wrap{margin:0 18px;padding:20px 16px 16px;position:relative;overflow:hidden;background:linear-gradient(150deg,#1D4A73,#0B2338);border-color:transparent;}
  .ascent-wrap .ridge-svg{position:absolute;left:0;bottom:0;width:100%;height:auto;}
  .ascent-head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;}
  .phase-tag{font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:600;}
  .phase-title{font-family:'Noto Sans JP',sans-serif;font-size:18px;font-weight:900;margin-top:4px;color:#FFFFFF;}
  .alt-now{text-align:right;}
  .alt-now .num{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700;color:var(--white);line-height:1;}
  .alt-now .unit{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.08em;}
  .ascent-body{position:relative;z-index:2;margin-top:54px;display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.65);font-family:'Poppins',sans-serif;letter-spacing:.03em;}

  .quicktiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px;}
  .tile{background:var(--navy-card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .tile .ic{width:30px;height:30px;border-radius:9px;background:rgba(232,130,95,.15);display:flex;align-items:center;justify-content:center;}
  .tile .ic svg{width:16px;height:16px;stroke:var(--accent);}
  .tile .tl{font-size:11px;font-weight:700;line-height:1.3;}
  .tile .sub{font-size:9px;color:var(--muted);}

  .missioncard{margin:0 18px;padding:15px;display:flex;gap:13px;align-items:center;}
  .missioncard .mi{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;flex:none;}
  .missioncard .mi svg{width:20px;height:20px;stroke:var(--navy-deep);}
  .missioncard .body{flex:1;}
  .missioncard .ti{font-weight:700;font-size:13px;}
  .missioncard .de{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .missioncard .go{font-size:11px;color:var(--accent);font-weight:700;}

  .bottomnav{flex:none;height:74px;background:var(--navy-card);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding-top:10px;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--muted);position:relative;cursor:pointer;}
  .navitem.active{color:var(--navy-deep);}
  .navitem.active svg{stroke:var(--accent);}
  .navitem svg{width:20px;height:20px;stroke:currentColor;fill:none;}
  .navitem .talkdot{position:absolute;top:-2px;right:26%;width:6px;height:6px;border-radius:50%;background:var(--accent);}
  /* UNIT MAP */
  .unitmap-wrap{position:relative;padding:6px 0 30px;}
  .unitmap-ridge{position:absolute;left:0;top:0;width:100%;z-index:0;opacity:.5;}
  .unode-col{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px;padding:16px 0;}
  .unode{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;position:relative;}
  .unode.done{background:var(--pine);color:#E9F3EC;}
  .unode.current{background:var(--accent);color:var(--navy-deep);box-shadow:0 0 0 5px rgba(232,130,95,.2);cursor:pointer;}
  .unode.locked{background:var(--navy-card);color:var(--muted);border:1px solid var(--line);}
  .unode svg{width:20px;height:20px;}
  .ucaption{font-size:9.5px;color:var(--muted);text-align:center;margin-top:6px;font-family:'Poppins',sans-serif;letter-spacing:.03em;}
  .progresspill{margin-top:-12px;background:var(--navy-card);border:1px solid var(--accent);border-radius:20px;padding:5px 13px;font-size:9.5px;color:var(--accent);font-family:'Poppins',sans-serif;}

  /* OUTPUT */
  .task-photo{margin:0 18px;border-radius:16px;overflow:hidden;position:relative;height:210px;background:linear-gradient(160deg,#1D4A73,#0B2338);}
  .task-photo .mesh{position:absolute;inset:0;background-image:radial-gradient(circle at 30% 20%, rgba(232,130,95,.16), transparent 60%);}
  .task-photo .cd{position:absolute;top:12px;right:12px;background:rgba(3,11,20,.65);border:1px solid var(--accent);border-radius:20px;padding:5px 12px;font-family:'Poppins',sans-serif;font-size:11.5px;color:var(--accent);}
  .task-photo .day{position:absolute;bottom:12px;left:14px;font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.12em;color:rgba(255,255,255,.7);text-transform:uppercase;}
  .task-prompt{margin:16px 18px 0;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:15px;line-height:1.7;}
  .task-actions{margin:20px 18px 0;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .rec-btn{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--accent), var(--accent-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -6px rgba(232,130,95,.45);cursor:pointer;}
  .rec-btn svg{width:24px;height:24px;stroke:var(--navy-deep);}
  .try-badge{font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
  .ghostbtn{border:1px solid var(--line);color:var(--ice);font-size:11.5px;padding:8px 16px;border-radius:20px;background:transparent;cursor:pointer;}
  .phrasebtn{margin:18px 18px 0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--accent);border:1px dashed rgba(232,130,95,.5);border-radius:12px;padding:10px;cursor:pointer;}

  /* MY PHRASE */
  .folder-grid{padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .folder{padding:14px;position:relative;}
  .folder .badge{position:absolute;top:10px;right:10px;background:rgba(232,130,95,.16);color:var(--accent);font-size:9.5px;padding:2px 7px;border-radius:8px;font-family:'Poppins',sans-serif;}
  .folder .ti{font-weight:700;font-size:12px;margin-top:16px;line-height:1.4;}
  .folder .sub{font-size:9.5px;color:var(--muted);margin-top:2px;}
  .folder.selected{border-color:var(--accent);}

  .flash{margin:16px 18px 0;padding:24px 18px;text-align:center;position:relative;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
  .flash .en{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:16px;}
  .flash .jp{font-size:11.5px;color:var(--muted);}
  .flash .rowbtns{display:flex;justify-content:center;gap:14px;margin-top:6px;}
  .iconbtn{width:32px;height:32px;border-radius:50%;background:var(--navy-elev);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn svg{width:14px;height:14px;stroke:var(--ice);}
  .iconbtn.sel{border-color:var(--accent);background:rgba(232,130,95,.15);}
  .iconbtn.sel svg{stroke:var(--accent);}
  .learned-btn{margin:16px 18px 0;text-align:center;background:transparent;border:1px solid var(--pine);color:#2C6B4A;padding:10px;border-radius:12px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .learned-btn.sel{background:var(--pine);color:#0E1F17;}

  /* RECORDS */
  .ring{width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,70%), var(--line) 0);display:flex;align-items:center;justify-content:center;position:relative;}
  .ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--navy-card);}
  .ring span{position:relative;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;}

  .scoperow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:10px;}
  .pilltoggle{display:flex;background:var(--navy-card);border:1px solid var(--line);border-radius:20px;padding:3px;}
  .pilltoggle .seg{padding:6px 14px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;}
  .pilltoggle .seg.active{background:var(--accent);color:#FFFFFF;}
  .pilltoggle.sm{padding:2px;}
  .pilltoggle.sm .seg{padding:4px 10px;font-size:10px;font-weight:600;}

  .cardnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .cardnav .navbtn{width:26px;height:26px;border-radius:8px;background:var(--navy-elev);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .cardnav .navbtn svg{width:12px;height:12px;stroke:var(--text);transform:rotate(180deg);}
  .cardnav .navbtn.next svg{transform:none;}
  .cardnav .lb{font-size:12.5px;font-weight:800;text-align:center;flex:1;}

  .periodtabs2{display:flex;gap:6px;padding:0 18px;margin-bottom:12px;}
  .periodtab2{flex:1;text-align:center;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:700;color:var(--ice);background:var(--navy-card);border:1px solid var(--line);cursor:pointer;}
  .periodtab2.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}

  .sumtable{margin:0 18px;}
  .sumrow{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:12px;}
  .sumrow:last-child{border-bottom:none;}
  .sumrow.sub{padding-left:14px;}
  .sumrow .metric{flex:1;font-weight:700;}
  .sumrow.sub .metric{font-weight:600;font-size:11.5px;color:var(--ice);}
  .sumrow .val{width:76px;text-align:right;font-family:'Poppins',sans-serif;color:var(--ice);font-size:11px;}
  .sumrow .pct{width:46px;text-align:right;font-weight:800;font-family:'Poppins',sans-serif;}
  .sumrow .pct.ok{color:var(--pine);}
  .sumrow .pct.ng{color:var(--danger);}

  .stackbars{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:100px;margin-top:14px;overflow-x:auto;}
  .stackbarcol{flex:0 0 auto;width:28px;display:flex;flex-direction:column;align-items:center;}
  .stackbarcol .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;}
  .stackbarcol .seg-study{background:var(--navy-elev);}
  .stackbarcol .seg-speak{background:linear-gradient(180deg,var(--accent),var(--accent-deep));}
  .stackbarcol .lb{font-size:9px;color:var(--muted);margin-top:6px;font-family:'Poppins',sans-serif;}
  .chartlegend2{display:flex;gap:16px;padding:0 2px;}
  .chartlegend2 .lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ice);}
  .chartlegend2 .sw{width:9px;height:9px;border-radius:2px;}

  .comingsoon{margin:0 18px;padding:40px 20px;text-align:center;color:var(--muted);font-size:12.5px;}

  /* CALENDAR */
  .calnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 18px 14px;}
  .calnav .navbtn{width:28px;height:28px;border-radius:8px;background:var(--navy-card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .calnav .navbtn svg{width:12px;height:12px;stroke:var(--text);transform:rotate(180deg);}
  .calnav .navbtn.next svg{transform:none;}
  .calnav .lb{font-weight:800;font-size:14px;min-width:90px;text-align:center;}
  .calgrid{margin:0 18px;padding:12px 8px 16px;}
  .calweekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .calweekdays span{text-align:center;font-size:10px;color:var(--muted);font-family:'Poppins',sans-serif;font-weight:600;}
  .caldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calcell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:11px;position:relative;}
  .calcell.empty{visibility:hidden;cursor:default;}
  .calcell.future{color:var(--muted);cursor:default;opacity:.4;}
  .calcell.nodata{color:var(--ice);background:var(--navy-elev);}
  .calcell.hasdata{color:#FFFFFF;background:var(--accent);font-weight:700;}
  .calcell.today{box-shadow:0 0 0 2px var(--navy) inset;}
  .calcell .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;}
  .callegend{display:flex;gap:16px;justify-content:center;margin-top:4px;font-size:10px;color:var(--muted);}
  .callegend .lg{display:flex;align-items:center;gap:5px;}
  .callegend .sw{width:9px;height:9px;border-radius:3px;}

  /* day log sheet */
  .daysheet .sheet{max-height:82vh;overflow-y:auto;}
  .daysheet-title{font-weight:800;font-size:14.5px;margin-bottom:2px;}
  .daysheet-sub{font-size:11px;color:var(--muted);margin-bottom:16px;}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .catoption{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;}
  .catoption.sel{border-color:var(--accent);background:rgba(232,130,95,.1);}
  .catoption .ic{width:34px;height:34px;border-radius:10px;background:var(--navy-elev);display:flex;align-items:center;justify-content:center;}
  .catoption.sel .ic{background:var(--accent);}
  .catoption .ic svg{width:16px;height:16px;stroke:var(--ice);}
  .catoption.sel .ic svg{stroke:#FFFFFF;}
  .catoption span{font-size:10.5px;font-weight:600;}
  .subchecklist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .subcheck{padding:7px 13px;border-radius:20px;border:1px solid var(--line);font-size:11.5px;color:var(--ice);cursor:pointer;}
  .subcheck.sel{background:rgba(232,130,95,.12);border-color:var(--accent);color:var(--accent-deep);font-weight:700;}
  .daysheet-footer{display:flex;gap:10px;margin-top:6px;}
  .daysheet-footer .primarybtn{flex:1;margin:0;}
  .deletebtn2{text-align:center;font-size:12px;color:var(--danger);font-weight:700;padding:10px;cursor:pointer;}

  .apptoast{
    position:absolute;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--navy-deep);color:#FFFFFF;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:600;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:300;white-space:nowrap;
  }
  .apptoast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* WEEKLY TEST HISTORY */
  .weeklyfilter{display:flex;gap:6px;padding:0 18px;margin-bottom:14px;}
  .weeklyfiltertab{flex:1;text-align:center;padding:7px 4px;border-radius:16px;font-size:11px;font-weight:700;color:var(--ice);background:var(--navy-card);border:1px solid var(--line);cursor:pointer;}
  .weeklyfiltertab.active{background:var(--navy);color:#FFFFFF;border-color:var(--navy);}
  .weekcta{margin:0 18px 16px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
  .weekcta .ic{width:36px;height:36px;border-radius:10px;background:rgba(232,130,95,.15);display:flex;align-items:center;justify-content:center;flex:none;}
  .weekcta .ic svg{width:17px;height:17px;stroke:var(--accent);}
  .weekcta .body{flex:1;}
  .weekcta .ti{font-weight:700;font-size:12.5px;}
  .weekcta .sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .weekrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .weekrow:last-child{border-bottom:none;}
  .weekrow .wk{font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;width:52px;flex:none;}
  .weekrow .date{font-size:10px;color:var(--muted);flex:1;}
  .paritag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:14px;}
  .paritag.pass{background:rgba(63,122,90,.14);color:var(--pine);}
  .paritag.fail{background:rgba(209,87,58,.12);color:var(--danger);}
  .paritag svg{width:10px;height:10px;stroke:currentColor;flex:none;}

  /* WEEKLY TEST TAKING */
  .weektestcard{margin:0 18px 14px;padding:18px;display:flex;align-items:center;gap:14px;}
  .weektestcard .ic{width:44px;height:44px;border-radius:12px;background:rgba(232,130,95,.15);display:flex;align-items:center;justify-content:center;flex:none;}
  .weektestcard .ic svg{width:20px;height:20px;stroke:var(--accent);}
  .weektestcard .body{flex:1;}
  .weektestcard .ti{font-weight:800;font-size:13.5px;}

    arr.push({ date:d, studyMin: Math.max(study, speak), speakMin: Math.min(speak, study) });

  return arr;
}

function recordPeriodRange(period, day){
  if(period==='day'){ const s=new Date(day); s.setHours(0,0,0,0); return {start:s, end:addDays(s,1), days:1}; }
  if(period==='week'){ const s=mondayOf(day); return {start:s, end:addDays(s,7), days:7}; }
  if(period==='month'){ const s=new Date(day.getFullYear(), day.getMonth(), 1); const e=new Date(day.getFullYear(), day.getMonth()+1, 1); const days=Math.round((e-s)/86400000); return {start:s, end:e, days}; }
  // all
  const arr = recordsView.scope==='personal' ? personalDailyStats : groupDailyStatsRecords;
  return { start: arr[0].date, end: addDays(arr[arr.length-1].date,1), days: arr.length };
}
function recordSumRange(arr, start, end){
  return arr.filter(x=> x.date>=start && x.date<end)
    .reduce((a,x)=>({studyMin:a.studyMin+x.studyMin, speakMin:a.speakMin+x.speakMin}), {studyMin:0, speakMin:0});
}
function recordChartBuckets(scope, period){
  const arr = scope==='personal' ? personalDailyStats : groupDailyStatsRecords;
  if(period==='day') return arr.slice(-7).map(x=>({label:['日','月','火','水','木','金','土'][x.date.getDay()], studyMin:x.studyMin, speakMin:x.speakMin}));
  if(period==='week'){
    const map = {};
    arr.forEach(x=>{ const k=weekKey(x.date); if(!map[k]) map[k]={label:shortMd(mondayOf(x.date)), studyMin:0, speakMin:0}; map[k].studyMin+=x.studyMin; map[k].speakMin+=x.speakMin; });
    return Object.values(map).slice(-6);
  }
  if(period==='month'){
    const map = {};
    arr.forEach(x=>{ const k=monthKey(x.date); if(!map[k]) map[k]={label:(x.date.getMonth()+1)+'月', studyMin:0, speakMin:0}; map[k].studyMin+=x.studyMin; map[k].speakMin+=x.speakMin; });
    return Object.values(map);
  }
  // all
  const total = arr.reduce((a,x)=>({studyMin:a.studyMin+x.studyMin, speakMin:a.speakMin+x.speakMin}), {studyMin:0,speakMin:0});
  return [{label:'全期間', studyMin:total.studyMin, speakMin:total.speakMin}];
}

function renderObField(f){

function renderRecordHistorySection(){
  const scope = recordsView.scope;
  const period = recordsView.period;
  const day = recordsView.currentDay;
  const arr = scope==='personal' ? personalDailyStats : groupDailyStatsRecords;
  const goal = RECORD_GOALS[scope];
  const range = recordPeriodRange(period, day);
  const sum = recordSumRange(arr, range.start, range.end);
  const studyTarget = Math.round(goal.study * range.days);
  const speakTarget = Math.round(goal.speak * range.days);
  const studyPct = studyTarget ? Math.round(sum.studyMin/studyTarget*100) : 0;
  const speakPct = speakTarget ? Math.round(sum.speakMin/speakTarget*100) : 0;

  const dayLabel = period==='day' ? `${shortMd(day)}（${['日','月','火','水','木','金','土'][day.getDay()]}）`
    : period==='week' ? `${shortMd(mondayOf(day))}〜${shortMd(addDays(mondayOf(day),6))}`
    : period==='month' ? `${day.getFullYear()}年${day.getMonth()+1}月`
    : '全期間';

  return `
    <div class="section-title" style="margin-top:4px;">学習履歴<a class="tap" id="addRecordBtn">＋ 新規登録</a></div>

    <div class="scoperow">
      <div class="pilltoggle sm" data-toggle-group="scope">
        <div class="seg ${scope==='personal'?'active':''}" data-scope="personal">個人</div>
        <div class="seg ${scope==='group'?'active':''}" data-scope="group">グループ</div>
      </div>
    </div>

    <div class="periodtabs2">
      ${['day','week','month','all'].map(p=>`<div class="periodtab2 ${period===p?'active':''}" data-period2="${p}">${{day:'日別',week:'週別',month:'月別',all:'全期間'}[p]}</div>`).join('')}
    </div>

    <div class="card" style="margin:0 18px 16px;padding:14px 16px;">
      <div class="cardnav">
        ${period!=='all' ? `<div class="navbtn tap" id="recordPrevBtn">${icons.chev}</div>` : `<div style="width:26px;"></div>`}
        <div class="lb">${dayLabel}</div>
        ${period!=='all' ? `<div class="navbtn next tap" id="recordNextBtn">${icons.chev}</div>` : `<div style="width:26px;"></div>`}
      </div>
      <div class="sumtable">
        <div class="sumrow">
          <div class="metric">総学習時間</div>
          <div class="val">${sum.studyMin}分 / ${studyTarget}分</div>
          <div class="pct ${studyPct>=100?'ok':'ng'}">${studyPct}%</div>
        </div>
        <div class="sumrow sub">
          <div class="metric">うち発話</div>
          <div class="val">${sum.speakMin}分 / ${speakTarget}分</div>
          <div class="pct ${speakPct>=100?'ok':'ng'}">${speakPct}%</div>
        </div>
      </div>
    </div>

    ${scope==='group' ? `<div class="historylinkrow tap" data-nav="group_members">グループのメンバーを見る（${groupMembers.length+1}人）</div>` : ''}

    <div class="card" style="margin:0 18px 16px;padding:16px;">
      <div class="chartlegend2">
        <div class="lg"><span class="sw" style="background:var(--accent);"></span>発話時間</div>
        <div class="lg"><span class="sw" style="background:var(--navy-elev);"></span>その他学習時間</div>
      </div>
      ${renderRecordChart()}
    </div>

    <div class="section-title">スピーキング履歴${speakingHistoryLog.length>5?`<a class="tap" data-nav="speaking_history_full">全て見る</a>`:''}</div>
    <div class="card" style="margin:0 18px;">
      ${speakingHistoryLog.slice(0,5).map(s=>`<div class="logrow"><span>${s.title}</span><span class="t">${shortMd(s.date)} ${String(s.date.getHours()).padStart(2,'0')}:${String(s.date.getMinutes()).padStart(2,'0')}</span></div>`).join('')}
    </div>
  `;
}

function renderRecordChart(){
  const scope = recordsView.scope, period = recordsView.period;
  const buckets = recordChartBuckets(scope, period==='all'?'all':period==='day'?'day':period);
  const max = Math.max(...buckets.map(b=>b.studyMin), 1);
  return `<div class="stackbars">
    ${buckets.map(b=>{
      const totalH = Math.round(b.studyMin/max*90);
      const speakH = b.studyMin ? Math.round(totalH * b.speakMin/b.studyMin) : 0;
      const otherH = totalH - speakH;
      return `<div class="stackbarcol">
        <div class="stack" style="height:${totalH}px;">
          <div class="seg-study" style="height:${otherH}px;"></div>
          <div class="seg-speak" style="height:${speakH}px;"></div>
        </div>
        <div class="lb">${b.label}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderCalendarSection(){
  const month = calendarState.month;
  const year = month.getFullYear(), mo = month.getMonth();
  const firstDay = new Date(year, mo, 1);
  const daysInMonth = new Date(year, mo+1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const today = new Date(); today.setHours(0,0,0,0);

  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  return `
    <div class="calnav">
      <div class="navbtn tap" id="calPrevBtn">${icons.chev}</div>
      <div class="lb">${year}年${mo+1}月</div>
      <div class="navbtn next tap" id="calNextBtn">${icons.chev}</div>
    </div>
    <div class="card calgrid">
      <div class="calweekdays">${['日','月','火','水','木','金','土'].map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="caldays">
        ${cells.map(d=>{
          if(d===null) return `<div class="calcell empty"></div>`;
          const cellDate = new Date(year, mo, d); cellDate.setHours(0,0,0,0);
          const key = dateKey(cellDate);
          const isFuture = cellDate > today;
          const isToday = cellDate.getTime() === today.getTime();
          const entry = studyLogEntries[key];
          const cls = isFuture ? 'future' : (entry ? 'hasdata' : 'nodata');
          return `<div class="calcell ${cls} ${isToday?'today':''}" ${isFuture?'':`data-daycell="${key}"`}>
            <span>${d}</span>
            ${entry ? `<span class="dot"></span>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="callegend">
        <div class="lg"><span class="sw" style="background:var(--accent);"></span>記録あり</div>
        <div class="lg"><span class="sw" style="background:var(--navy-elev);"></span>記録なし（タップで登録）</div>
      </div>
    </div>
  `;
}

let history_stack = ['splash'];

function showToast(msg){
  const t = document.getElementById('appToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function goTo(key, push=true){
  let s = screens[key];
  if(!s){
    // handle synthetic keys
    if(key==='auth_signup'){ state.authTab='signup'; key='auth'; s=screens.auth; }
    else if(key==='auth_login'){ state.authTab='login'; key='auth'; s=screens.auth; }
    else if(key==='ob_start'){ key='ob1'; s=screens.ob1; }
    else if(key==='login_go_home'){ state.profileComplete=true; history_stack=['home']; key='home'; s=screens.home; }
    else if(key==='onboard_finish'){ state.profileComplete=true; history_stack=['home']; key='home'; s=screens.home; }
  }
  if(!s) return;
  if(key === 'talk_call' && !talkCallState.active) startTalkCall();
  if(key !== 'talk_call' && talkCallState.active) endTalkCall(false);
  document.getElementById('screen').innerHTML = `<div class="fade">${s.html()}</div>`;
  document.getElementById('bottomnav').innerHTML = s.nav ? bottomNavHTML(s.nav) : '';
  document.getElementById('bottomnav').style.display = s.nav ? 'flex' : 'none';
  document.getElementById('screen').scrollTop = 0;
  if(push){
    if(history_stack[history_stack.length-1] !== key) history_stack.push(key);
  }
}

function talkAvatarHTML(t){
  return t.kind==='official' ? icons.official : t.letter;
}
function talkAvatarStyle(t){
  return `style="background:${t.color};"`;
}

function renderTalkMessages(t){
  return t.messages.map(m=>`
    <div class="talkbubble-row ${m.from==='me'?'me':'them'}">
      <div class="talkbubble">${m.text}</div>
      <div class="talktime">${m.time}</div>
    </div>
  `).join('');
}

function formatCallTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startTalkCall(){
  talkCallState.active = true;
  talkCallState.seconds = 0;
  talkCallState.muted = false;
  clearInterval(talkCallState.timer);
  talkCallState.timer = setInterval(()=>{
    talkCallState.seconds++;
    const el = document.getElementById('callTimer');
    if(el) el.textContent = formatCallTime(talkCallState.seconds);
  }, 1000);
}

function endTalkCall(){
  clearInterval(talkCallState.timer);
  talkCallState.active = false;
  talkCallState.timer = null;
}

const AI_REPLIES = {
  justin: [
    "Nice, let's keep that momentum going!",
    "That's a great point. Could you say a bit more about why you think that?",
    "Got it! Let's try using that phrase in your next free practice session.",
  ],
  bob: [
    "Haha, I hear you. What happened next?",
    "That sounds tough, but it sounds like you handled it well.",
    "Same here, honestly. Anyway, want to practice a quick roleplay?",
  ],
  sara: [
    "That's a strong opening line! Try slowing down just a little on the second sentence.",
    "I like where this is going. What's your main point going to be?",
    "Good, that's much clearer now. One more time from the top?",
  ],
};
function sendTalkMessage(threadKey){
  const input = document.getElementById('talkInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const t = talkThreads[threadKey];
  t.messages.push({from:'me', text, time:'たった今'});
  input.value = '';
  const box = document.getElementById('talkThreadBox');
  if(box) box.innerHTML = renderTalkMessages(t);
  if(t.kind === 'ai'){
    setTimeout(()=>{
      const pool = AI_REPLIES[threadKey] || [];
      const reply = pool[Math.floor(Math.random()*pool.length)];
      t.messages.push({from:'them', text:reply, time:'たった今'});
      const box2 = document.getElementById('talkThreadBox');
      if(box2 && currentTalkThread === threadKey) box2.innerHTML = renderTalkMessages(t);
    }, 900);
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && e.target.id === 'talkInput'){
    sendTalkMessage(e.target.dataset.thread);
  }
});

document.addEventListener('input', (e)=>{
  const f = e.target.closest('[data-field]');
  if(f){
    profile[f.dataset.field] = f.value;
    // keep the topbar avatar / mypage hero name in sync without losing input focus by not re-rendering here
  }
});

document.addEventListener('click', (e)=>{
  // records: scope toggle (個人/グループ)
  const scopeSeg = e.target.closest('[data-scope]');
  if(scopeSeg){
    recordsView.scope = scopeSeg.dataset.scope;
    const box = document.getElementById('recordHistoryBox');
    if(box) box.innerHTML = renderRecordHistorySection();
    return;
  }
  // records: period tabs (日別/週別/月別/全期間)
  const period2 = e.target.closest('[data-period2]');
  if(period2){
    recordsView.period = period2.dataset.period2;
    const box = document.getElementById('recordHistoryBox');
    if(box) box.innerHTML = renderRecordHistorySection();
    return;
  }
  // records: day navigation
  if(e.target.closest('#recordPrevBtn') || e.target.closest('#recordNextBtn')){
    const dir = e.target.closest('#recordNextBtn') ? 1 : -1;
    const p = recordsView.period;
    if(p==='day') recordsView.currentDay = addDays(recordsView.currentDay, dir);
    else if(p==='week') recordsView.currentDay = addDays(recordsView.currentDay, dir*7);
    else if(p==='month') recordsView.currentDay = new Date(recordsView.currentDay.getFullYear(), recordsView.currentDay.getMonth()+dir, 1);
    const box = document.getElementById('recordHistoryBox');
    if(box) box.innerHTML = renderRecordHistorySection();
    return;
  }

  // calendar: month navigation
  if(e.target.closest('#calPrevBtn') || e.target.closest('#calNextBtn')){
    const dir = e.target.closest('#calNextBtn') ? 1 : -1;
    calendarState.month = new Date(calendarState.month.getFullYear(), calendarState.month.getMonth()+dir, 1);
    const box = document.getElementById('recordCalendarBox');
    if(box) box.innerHTML = renderCalendarSection();
    return;
  }

  // 目標履歴: 新しい目標を設定
  if(e.target.closest('#newGoalBtn')){
    document.getElementById('newGoalInput').value = profile.termGoal;
    document.getElementById('goalSheetOverlay').style.display = 'flex';
    return;
  }
  if(e.target.closest('#goalSheetCancel') || e.target.id === 'goalSheetOverlay'){
    document.getElementById('goalSheetOverlay').style.display = 'none';
    return;
  }
  if(e.target.closest('#goalSheetSave')){
    const text = document.getElementById('newGoalInput').value.trim();
    if(!text){ showToast('目標を入力してください'); return; }
    termGoalHistory.forEach(g=>delete g.current);
    const today = new Date();
    termGoalHistory.push({ term:'Phase 3 · Term 2', goal:text, setDate:`${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`, current:true });
    profile.termGoal = text;
    document.getElementById('goalSheetOverlay').style.display = 'none';
    goTo('goal_history', false);
    showToast('新しい目標を設定しました');
    return;
  }

  // 学習履歴: 新規登録ボタン（今日の日付でシートを開く。常に新規入力フォーム）
  if(e.target.closest('#addRecordBtn')){
    const today = new Date(); today.setHours(0,0,0,0);
    const key = dateKey(today);
    daySheetState = { dateKey:key, category:null, subcategories:[], forceNew:true };
    document.getElementById('daySheetContent').innerHTML = renderDaySheetBody();
    document.getElementById('daySheetOverlay').style.display = 'flex';
    return;
  }

  // calendar: tap a day cell → open the add/edit sheet
  const dayCell = e.target.closest('[data-daycell]');
  if(dayCell){
    const key = dayCell.dataset.daycell;
    const entry = studyLogEntries[key];
    daySheetState = { dateKey:key, category: entry?entry.category:null, subcategories: entry?[...entry.subcategories]:[], forceNew:false };
    document.getElementById('daySheetContent').innerHTML = renderDaySheetBody();
    document.getElementById('daySheetOverlay').style.display = 'flex';
    return;
  }
  // day sheet: category select (single)
  const dayCat = e.target.closest('[data-daycat]');
  if(dayCat){
    daySheetState.category = dayCat.dataset.daycat;
    document.getElementById('daySheetContent').innerHTML = renderDaySheetBody();
    return;
  }
  // day sheet: subcategory toggle (multi)
  const daySub = e.target.closest('[data-daysub]');
  if(daySub){
    const v = daySub.dataset.daysub;
    const idx = daySheetState.subcategories.indexOf(v);
    if(idx>-1) daySheetState.subcategories.splice(idx,1); else daySheetState.subcategories.push(v);
    document.getElementById('daySheetContent').innerHTML = renderDaySheetBody();
    return;
  }
  // day sheet: cancel / backdrop click
  if(e.target.closest('#daySheetCancel') || e.target.id === 'daySheetOverlay'){
    document.getElementById('daySheetOverlay').style.display = 'none';
    return;
  }
  // day sheet: submit (register/edit)
  if(e.target.closest('#daySheetSubmit')){
    if(!daySheetState.category){ showToast('カテゴリーを選択してください'); return; }
    const minutes = parseInt(document.getElementById('dayMinutesInput').value) || 0;
    const memo = document.getElementById('dayMemoInput').value;
    studyLogEntries[daySheetState.dateKey] = {
      category: daySheetState.category,
      subcategories: daySheetState.subcategories.length ? daySheetState.subcategories : [STUDY_SUBCATEGORIES[0]],
      minutes, memo,
    };
    document.getElementById('daySheetOverlay').style.display = 'none';
    const box = document.getElementById('recordCalendarBox');
    if(box) box.innerHTML = renderCalendarSection();
    showToast('学習記録を保存しました');
    return;
  }
  // day sheet: delete
  if(e.target.closest('#daySheetDelete')){
    delete studyLogEntries[daySheetState.dateKey];
    document.getElementById('daySheetOverlay').style.display = 'none';
    const box = document.getElementById('recordCalendarBox');
    if(box) box.innerHTML = renderCalendarSection();
    showToast('学習記録を削除しました');
    return;
  }

  // weekly test history: filter tabs
  const wf = e.target.closest('[data-weeklyfilter]');
  if(wf){
    weeklyFilter = wf.dataset.weeklyfilter;
    const box = document.getElementById('recordWeeklyBox');
    if(box) box.innerHTML = renderWeeklySection();
    return;
  }

  // weekly input test: select an option
  const qOpt = e.target.closest('[data-qopt]');
  if(qOpt){
    weeklyInputState.answers[weeklyInputState.qIndex] = parseInt(qOpt.dataset.qopt);
    goTo('weekly_input_test', false);
    return;
  }
  // weekly input test: next / finish
  if(e.target.closest('#qNextBtn')){
    if(weeklyInputState.answers[weeklyInputState.qIndex] === undefined){ showToast('選択肢を選んでください'); return; }
    if(weeklyInputState.qIndex < INPUT_TEST_QUESTIONS.length-1){
      weeklyInputState.qIndex++;
      goTo('weekly_input_test', false);
    } else {
      const correctCount = weeklyInputState.answers.filter((a,i)=>a===INPUT_TEST_QUESTIONS[i].correct).length;
      thisWeekTest.inputDone = true;
      thisWeekTest.inputPass = correctCount >= 2;
      const entry = ensureThisWeekResultEntry();
      entry.inputPass = thisWeekTest.inputPass;
      weeklyInputState = { qIndex:0, answers:[] };
      goTo('weekly_input_result', false);
    }
    return;
  }
  // weekly output test: submit recording for AI grading
  if(e.target.closest('#outputTestSubmitBtn')){
    weeklyOutputResult = OUTPUT_TEST_FEEDBACK_POOL[Math.floor(Math.random()*OUTPUT_TEST_FEEDBACK_POOL.length)];
    thisWeekTest.outputDone = true;
    thisWeekTest.outputPass = !weeklyOutputResult.grade.startsWith('C');
    const entry = ensureThisWeekResultEntry();
    entry.outputPass = thisWeekTest.outputPass;
    setTimeout(()=> goTo('weekly_output_result', false), 700);
    return;
  }

  // talk: send message
  const sendBtn = e.target.closest('[data-action="talk-send"]');
  if(sendBtn){
    sendTalkMessage(sendBtn.dataset.thread);
    return;
  }
  // call: mute toggle
  if(e.target.closest('#callMuteBtn')){
    talkCallState.muted = !talkCallState.muted;
    goTo('talk_call', false);
    return;
  }
  if(e.target.closest('#callSpeakerBtn')){
    return; // decorative only in this demo
  }
  // call: end
  if(e.target.closest('#callEndBtn')){
    endTalkCall();
    if(history_stack[history_stack.length-1] === 'talk_call') history_stack.pop();
    goTo('talk_thread', false);
    return;
  }

  const chip = e.target.closest('[data-chip]');
  if(chip){
    const [f, val] = chip.dataset.chip.split('|');
    profile[f] = val;
    // re-render current top of stack
    goTo(history_stack[history_stack.length-1], false);
    return;
  }
  // quiz option pills (出題数 / 出題順) — single-select within their group
  const opt = e.target.closest('.opt');
  if(opt){
    opt.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    opt.classList.add('sel');
    return;
  }
  // MYフレーズ folder selection
  const folder = e.target.closest('.folder');
  if(folder && folder.parentElement.dataset.group === 'folder'){
    folder.parentElement.querySelectorAll('.folder').forEach(f=>f.classList.remove('selected'));
    folder.classList.add('selected');
    return;
  }
  // generic toggle buttons (play / show-hide / learned)
  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    toggle.classList.toggle('sel');
    return;
  }
  const action = e.target.closest('[data-action]');
  if(action){
    const a = action.dataset.action;
    if(a==='authtab-login'){ state.authTab='login'; goTo('auth', false); return; }
    if(a==='authtab-signup'){ state.authTab='signup'; goTo('auth', false); return; }
    if(a==='grant-mic'){ state.permMic=true; goTo('obperm', false); return; }
    if(a==='grant-speaker'){ state.permSpeaker=true; goTo('obperm', false); return; }
    if(a==='open-logout'){ state.mypageLogoutOpen=true; goTo('mypage', false); return; }
    if(a==='close-logout'){ state.mypageLogoutOpen=false; goTo('mypage', false); return; }
    if(a==='confirm-logout'){
      state.mypageLogoutOpen=false;
      state.authTab='login';
      state.profileComplete=false;
      history_stack=['auth'];
      goTo('auth', false);
      return;
    }
  }
  const el = e.target.closest('[data-nav]');
  if(!el) return;
  const key = el.dataset.nav;
  if(el.dataset.thread) currentTalkThread = el.dataset.thread;
  if(el.dataset.member) currentMemberId = el.dataset.member;
  if(el.dataset.pastgroup !== undefined) currentPastGroupIdx = parseInt(el.dataset.pastgroup);
  if(key === 'home') history_stack = ['home'];
  goTo(key, key!=='home');
});

goTo('splash', false);
</script>
