<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native App Prototype v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0B2338;
            --navy: #14365A;
            --navy-elev: #EEF1F4;
            --navy-card: #FFFFFF;
            --ice: #57677B;
            --muted: #8791A0;
            --white: #FFFFFF;
            --text: #0F2439;
            --accent: #E8825F;
            --accent-deep: #C25F3D;
            --pine: #3F7A5C;
            --line: rgba(15, 36, 57, .10);
            --danger: #D1573A;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #EDEFF3;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text);
        }

        .stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 32px 16px 64px;
        }

        .lab {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }

        .hint {
            max-width: 390px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .hint b {
            color: var(--accent);
        }

        .phone {
            width: 390px;
            max-width: 92vw;
            height: 844px;
            max-height: 88vh;
            background: var(--navy-elev);
            border-radius: 44px;
            border: 8px solid #030B14;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .04);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 26px;
            background: #030B14;
            border-radius: 0 0 16px 16px;
            z-index: 60;
        }

        .statusbar {
            height: 44px;
            flex: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 26px 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .fade {
            animation: fadein .22s ease;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topbar {
            padding: 2px 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }

        .topbar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .backbtn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(15, 36, 57, .06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
        }

        .backbtn svg {
            width: 15px;
            height: 15px;
            stroke: var(--text);
        }

        .screentitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .01em;
        }

        .mark {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--navy);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
        }

        .mark svg {
            width: 16px;
            height: 16px;
            stroke: #FFFFFF;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--navy-card);
            border: 1.5px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
        }

        .warnbanner {
            margin: 0 18px 14px;
            padding: 10px 13px;
            border-radius: 10px;
            background: rgba(225, 132, 107, .14);
            border: 1px solid rgba(225, 132, 107, .4);
            color: #A8432B;
            font-size: 11.5px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
        }

        .warnbanner svg {
            width: 16px;
            height: 16px;
            stroke: #A8432B;
            flex: none;
        }

        .warnbanner b {
            color: var(--text);
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 11.5px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0 18px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title a {
            color: var(--accent);
            font-size: 11px;
            letter-spacing: 0;
            text-transform: none;
            text-decoration: none;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }

        .card {
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .tap {
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
        }

        .tap:active {
            transform: scale(.97);
            background: var(--navy-elev);
        }

        /* HOME */
        .ascent-wrap {
            margin: 0 18px;
            padding: 20px 16px 16px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(150deg, #1D4A73, #0B2338);
            border-color: transparent;
        }

        .ascent-wrap .ridge-svg {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: auto;
        }

        .ascent-head {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .phase-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .14em;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
        }

        .phase-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 18px;
            font-weight: 900;
            margin-top: 4px;
            color: #FFFFFF;
        }

        .alt-now {
            text-align: right;
        }

        .alt-now .num {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .alt-now .unit {
            font-size: 9.5px;
            color: rgba(255, 255, 255, .55);
            letter-spacing: .08em;
        }

        .ascent-body {
            position: relative;
            z-index: 2;
            margin-top: 54px;
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            color: rgba(255, 255, 255, .65);
            font-family: 'Poppins', sans-serif;
            letter-spacing: .03em;
        }

        .ascentscene {
            position: relative;
            margin: 0 18px 16px;
            border-radius: 20px;
            overflow: hidden;
        }

        .ascentscene-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .ascentdot {
            fill: var(--navy-elev);
            opacity: .5;
        }

        .ascentdot.done {
            fill: #E8825F;
            opacity: 1;
        }

        .ascentdot.current {
            fill: #FFFFFF;
            stroke: #E8825F;
            stroke-width: 2;
            opacity: 1;
        }

        .ascentmarker circle:last-child {
            animation: ascentpulse 2s ease-in-out infinite;
        }

        @keyframes ascentpulse {

            0%,
            100% {
                r: 8;
            }

            50% {
                r: 9.5;
            }
        }

        .ascentscene-overlay {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 16px 18px;
            background: linear-gradient(0deg, rgba(11, 35, 56, .85), transparent);
            text-align: center;
        }

        .ascentclimb-num {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 30px;
            color: #FFFFFF;
        }

        .ascentclimb-num span {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, .65);
            margin-left: 3px;
        }

        .ascentclimb-label {
            font-size: 11px;
            color: rgba(255, 255, 255, .75);
            margin-top: 2px;
            font-weight: 600;
        }

        .ascentclimb-next-card {
            margin: 0 18px 16px;
            padding: 18px;
            text-align: center;
        }

        .ascentclimb-nexttitle {
            font-weight: 800;
            font-size: 13.5px;
        }

        .ascentclimb-nextsub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 5px;
        }

        .ascentclimb-viewroute {
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 700;
            margin-top: 14px;
            cursor: pointer;
        }

        .ascentlist {
            margin-top: 14px;
            max-height: 280px;
            overflow-y: auto;
        }

        .ascentlistrow {
            display: flex;
            justify-content: space-between;
            padding: 10px 2px;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
            color: var(--muted);
        }

        .ascentlistrow:last-child {
            border-bottom: none;
        }

        .ascentlistrow.done {
            color: var(--text);
            font-weight: 700;
        }

        .ascentlistrow .m {
            font-family: 'Poppins', sans-serif;
        }

        .quicktiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 18px;
        }

        .quicktiles-4 {
            grid-template-columns: repeat(2, 1fr);
        }

        .tile {
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .tile .ic {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: rgba(232, 130, 95, .15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile .ic svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
        }

        .tile .tl {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }

        .tile .sub {
            font-size: 9px;
            color: var(--muted);
        }


        .bottomnav {
            flex: none;
            height: 74px;
            background: var(--navy-card);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: flex-start;
            padding-top: 10px;
        }

        .navitem {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 9.5px;
            color: var(--muted);
            position: relative;
            cursor: pointer;
        }

        .navitem.active {
            color: var(--navy-deep);
        }

        .navitem.active svg {
            stroke: var(--accent);
        }

        .navitem svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .navitem .talkdot {
            position: absolute;
            top: -2px;
            right: 26%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* UNIT MAP */
        .unitmap-wrap {
            position: relative;
            padding: 6px 0 30px;
        }

        .unitmap-ridge {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            z-index: 0;
            opacity: .5;
        }

        .unode-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 16px 0;
        }

        .unode {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            position: relative;
        }

        .unode.done {
            background: var(--pine);
            color: #E9F3EC;
        }

        .unode.current {
            background: var(--accent);
            color: var(--navy-deep);
            box-shadow: 0 0 0 5px rgba(232, 130, 95, .2);
            cursor: pointer;
        }

        .unode.locked {
            background: var(--navy-card);
            color: var(--muted);
            border: 1px solid var(--line);
        }

        .unode svg {
            width: 20px;
            height: 20px;
        }

        .ucaption {
            font-size: 9.5px;
            color: var(--muted);
            text-align: center;
            margin-top: 6px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: .03em;
        }

        .progresspill {
            margin-top: -12px;
            background: var(--navy-card);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 5px 13px;
            font-size: 9.5px;
            color: var(--accent);
            font-family: 'Poppins', sans-serif;
        }

        /* OUTPUT */
        .task-photo {
            margin: 0 18px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            height: 210px;
            background: linear-gradient(160deg, #1D4A73, #0B2338);
        }

        .task-photo .mesh {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 30% 20%, rgba(232, 130, 95, .16), transparent 60%);
        }

        .task-photo .cd {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(3, 11, 20, .65);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 5px 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 11.5px;
            color: var(--accent);
        }

        .task-photo .day {
            position: absolute;
            bottom: 12px;
            left: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .12em;
            color: rgba(255, 255, 255, .7);
            text-transform: uppercase;
        }

        .task-prompt {
            margin: 16px 18px 0;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.7;
        }

        .task-actions {
            margin: 20px 18px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .rec-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px -6px rgba(232, 130, 95, .45);
            cursor: pointer;
        }

        .rec-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--navy-deep);
        }

        .try-badge {
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .ghostbtn {
            border: 1px solid var(--line);
            color: var(--ice);
            font-size: 11.5px;
            padding: 8px 16px;
            border-radius: 20px;
            background: transparent;
            cursor: pointer;
        }

        .phrasebtn {
            margin: 18px 18px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--accent);
            border: 1px dashed rgba(232, 130, 95, .5);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }

        .phrasebtn svg {
            width: 14px;
            height: 14px;
            stroke: var(--accent);
            flex: none;
        }

        /* MY PHRASE */
        .folder-grid {
            padding: 0 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .folder {
            padding: 14px;
            position: relative;
        }

        .folder .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(232, 130, 95, .16);
            color: var(--accent);
            font-size: 9.5px;
            padding: 2px 7px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .folder .ti {
            font-weight: 700;
            font-size: 12px;
            margin-top: 16px;
            line-height: 1.4;
        }

        .folder .sub {
            font-size: 9.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .folder.selected {
            border-color: var(--accent);
        }

        .folder-del {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--navy-elev);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .folder-del svg {
            width: 9px;
            height: 9px;
            stroke: var(--muted);
        }

        .folder-add {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1.5px dashed var(--line);
            background: transparent;
            box-shadow: none;
            min-height: 88px;
        }

        .folder-add-ic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(232, 130, 95, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .folder-add-ic svg {
            width: 13px;
            height: 13px;
            stroke: var(--accent);
        }

        .folder-add .ti {
            margin-top: 0;
            color: var(--muted);
            font-size: 11.5px;
        }

        .phrasefolderpicker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .folderchip {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ice);
            background: var(--navy-card);
            border: 1px solid var(--line);
            padding: 7px 13px;
            border-radius: 20px;
            cursor: pointer;
        }

        .folderchip.sel {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
            font-weight: 700;
        }

        .folderchip.addnew {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-style: dashed;
            color: var(--accent);
        }

        .folderchip.addnew svg {
            width: 10px;
            height: 10px;
            stroke: var(--accent);
        }

        .flash {
            margin: 16px 18px 0;
            padding: 24px 18px;
            text-align: center;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .flash .en {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .flash .jp {
            font-size: 11.5px;
            color: var(--muted);
        }

        .flash .rowbtns {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
        }

        .iconbtn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--navy-elev);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .iconbtn svg {
            width: 14px;
            height: 14px;
            stroke: var(--ice);
        }

        .iconbtn.sel {
            border-color: var(--accent);
            background: rgba(232, 130, 95, .15);
        }

        .iconbtn.sel svg {
            stroke: var(--accent);
        }

        .learned-btn {
            margin: 16px 18px 0;
            text-align: center;
            background: transparent;
            border: 1px solid var(--pine);
            color: #2C6B4A;
            padding: 10px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .learned-btn.sel {
            background: var(--pine);
            color: #0E1F17;
        }

        /* RECORDS */
        .ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--pct, 70%), var(--line) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ring::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: var(--navy-card);
        }

        .ring span {
            position: relative;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .scoperow {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            margin-bottom: 10px;
        }

        .pilltoggle {
            display: flex;
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 3px;

                            { from: 'me', text: "Yeah, they want to move the launch up by two weeks.", textJP: "うん、リリースを2週間前倒ししたいって言われてる。" },
                            { from: 'them', text: "That's tight. Is it even possible on our end?", textJP: "それはきついね。こっちで対応できそう？" },
                            { from: 'me', text: `As a ${positionEN()}, I'd need to check with the ${jobEN()} team, but I don't think it's realistic without cutting scope.`, textJP: `${profile.position}として${profile.job}チームに確認は必要だけど、範囲を削らないと現実的じゃないと思う。` },
                            { from: 'them', text: "Let's flag that in tomorrow's check-in before we commit to anything.", textJP: "明日のミーティングで一度共有してから、正式に決めよう。" },
                        ],
                    };
                }
                return {
                    counterpart: 'Mike（同僚）',
                    lines: [
                        { from: 'them', text: "Hey, do you have a minute? I wanted to ask about the client meeting yesterday.", textJP: "ねえ、ちょっといい？昨日のクライアントとの打ち合わせについて聞きたくて。" },
                        { from: 'me', text: "Sure. It went well overall, but they had some concerns about the pricing.", textJP: "いいよ。全体的には良かったけど、価格面で少し懸念を示されたよ。" },
                        { from: 'them', text: "Ah, I see. Did they mention anything specific?", textJP: "なるほど。何か具体的に言われた？" },
                        { from: 'me', text: `Yeah, as a ${positionEN()} I told them we could offer more flexible terms, but I need to check with the team first.`, textJP: `うん、${profile.position}として、もう少し柔軟な条件を出せると伝えたけど、まずチームに確認しないといけない。` },
                        { from: 'them', text: "Got it. Let me know if you need backup for the follow-up call.", textJP: "了解。フォローアップの電話でサポートが必要なら言ってね。" },
                    ],
                };
            }
            if (scene === '社内ミーティング') {
                if (variant === 1) {
                    return {
                        counterpart: 'Sarah（進行役）',
                        lines: [
                            { from: 'them', text: "Let's move on to risks. Anything that could slip this quarter?", textJP: "次はリスクについて話しましょう。今期ずれ込みそうなものはある？" },
                            { from: 'me', text: `From the ${jobEN()} side, the biggest risk is approval delays on new contracts.`, textJP: `${profile.job}側から見ると、一番のリスクは新規契約の承認が遅れていることです。` },
                            { from: 'them', text: "How much of a delay are we talking about?", textJP: "どのくらいの遅れが出ていますか？" },
                            { from: 'me', text: "Usually a week or two, but it's added up across several deals.", textJP: "通常1〜2週間程度ですが、複数の案件で積み重なっています。" },
                            { from: 'them', text: "Okay, let's raise that with legal separately.", textJP: "分かりました、それは別途法務チームに共有しましょう。" },
                        ],
                    };
                }
                return {
                    counterpart: 'Sarah（進行役）',
                    lines: [
                        { from: 'them', text: "Let's start with updates from the sales side. Could you share where things stand?", textJP: "では営業側の状況から始めましょう。現状を共有してもらえますか？" },
                        { from: 'me', text: `Sure. As a ${positionEN()} on the ${jobEN()} team, I've been focusing on the new accounts this quarter.`, textJP: `はい。${profile.job}チームの${profile.position}として、今期は新規口座に注力してきました。` },
                        { from: 'them', text: "Any blockers we should know about?", textJP: "何か障害になっていることはありますか？" },
                        { from: 'me', text: "Mainly the pricing approval process — it's slowing down a few deals.", textJP: "主に価格承認のプロセスです。いくつかの案件で進行が遅れています。" },
                        { from: 'them', text: "Noted. Let's circle back on that after the meeting.", textJP: "分かりました。それはミーティング後に改めて話しましょう。" },
                    ],
                };
            }
            // 社外でのやりとり
            if (variant === 1) {
                return {
                    counterpart: 'Ms. Chen（取引先）',
                    lines: [
                        { from: 'them', text: "Before we finalize, I wanted to check on the support terms after launch.", textJP: "最終決定の前に、リリース後のサポート条件について確認したかったんです。" },
                        { from: 'me', text: "Good question — we typically include three months of support as standard.", textJP: "良い質問ですね。通常は標準で3ヶ月のサポートを含んでいます。" },
                        { from: 'them', text: "Would it be possible to extend that a bit, given the scope?", textJP: "規模を考えると、少し延長することは可能でしょうか？" },
                        { from: 'me', text: "I think so. Let me confirm internally and get back to you by tomorrow.", textJP: "可能だと思います。社内で確認して、明日までにご連絡します。" },
                        { from: 'them', text: "Perfect, that works on our end.", textJP: "完璧です、こちらとしても問題ありません。" },
                    ],
                };
            }
            return {
                counterpart: 'Ms. Chen（取引先）',
                lines: [
                    { from: 'them', text: "Thanks for jumping on this call. We wanted to revisit the proposal you sent last week.", textJP: "お電話ありがとうございます。先週いただいたご提案について改めて確認したく思います。" },
                    { from: 'me', text: "Of course. Happy to walk you through it again — is there a specific part you'd like to focus on?", textJP: "もちろんです。改めてご説明しますが、特に確認したい部分はありますか？" },
                    { from: 'them', text: "Mainly the implementation timeline. It feels a bit tight on our end.", textJP: "主に導入スケジュールについてです。こちらとしては少しタイトに感じています。" },
                    { from: 'me', text: "That's fair. Let me check internally and circle back with an adjusted schedule.", textJP: "おっしゃる通りですね。社内で確認して、調整したスケジュールでご連絡します。" },
                    { from: 'them', text: "That would be great, thank you.", textJP: "それは助かります、ありがとうございます。" },
                ],
            };
        }

        // ---- シチュエーション別課題：プレゼンテーション（一人語り） ----
        const PRESENTER_NAME_EN = 'Kenta Sato';
        function jobEN() {
            const map = { '営業': 'Sales', 'マーケティング': 'Marketing', 'エンジニア': 'Engineering', '人事': 'HR' };
            return map[profile.job] || 'Sales';
        }
        function positionEN() {
            const map = { 'マネージャー': 'Manager', '主任': 'Team Lead', '部長': 'Director' };
            return map[profile.position] || 'Manager';
        }

        function generatePresentation(variant) {
            variant = variant || 0;
            if (variant === 1) {
                return {
                    topic: '新サービス提案',
                    paragraphsEN: [
                        `Good morning, everyone, and thank you for making time for this today. My name is ${PRESENTER_NAME_EN}, and I work as a ${jobEN()} ${positionEN()} here on the team.`,
                        `I'd like to start by talking about a challenge we've been running into recently. Our approval process for new client proposals has been taking longer than expected, and in a few cases, it's put pressure on our delivery timelines. This isn't a small issue — it's something that's come up in almost every project this quarter.`,
                        `To address this, I'd like to propose a simpler, more flexible process. Instead of routing every proposal through the same multi-step approval chain, we could introduce a fast-track option for smaller deals, while keeping the full process for larger ones. This way, we reduce delays without lowering our standards.`,
                        `That's a quick overview of the problem and what I think we should do about it. I know this is a bit of a shift from how we currently operate, so I'd really appreciate your questions and honest feedback before we move forward.`,
                    ],
                    paragraphsJP: [
                        `皆さん、おはようございます。本日はお時間をいただきありがとうございます。私は${profile.name}、${profile.job}チームで${profile.position}をしております。`,
                        `まず、最近直面している課題についてお話しさせてください。新規の顧客提案に関する承認プロセスに想定以上の時間がかかっており、案件によっては納期に影響が出ています。これは小さな問題ではなく、今期ほぼすべてのプロジェクトで発生しています。`,
                        `この課題に対して、よりシンプルで柔軟なプロセスを提案したいと思います。すべての提案を同じ多段階の承認フローに通すのではなく、小規模案件には迅速承認のルートを設け、大規模案件には従来通りのフルプロセスを維持する、という形です。こうすることで、水準を下げずに遅延を減らせます。`,
                        `以上が課題の概要と、私が考える対応策です。今のやり方から少し変える提案になりますので、皆さんからのご質問や率直なフィードバックをいただけると助かります。`,
                    ],
                };
            }
            return {
                topic: '四半期の振り返りと提案',
                paragraphsEN: [
                    `Good morning, everyone. Thanks for joining today. My name is ${PRESENTER_NAME_EN}, and I currently work as a ${jobEN()} ${positionEN()}.`,
                    `This quarter, our team has been focused on strengthening relationships with our key accounts, and I'd like to walk you through where things currently stand. Overall, we've made steady progress, and client satisfaction scores have improved slightly compared to last quarter.`,
                    `That said, there are still a few areas where I think we can do better. Based on what we've learned so far, I believe we should prioritize a more flexible, client-specific approach going into next quarter, rather than applying the same playbook to every account.`,
                    `That's a quick summary of where we are and where I think we should focus next. Thank you again for your time today — I'm happy to take any questions you might have.`,
                ],
                paragraphsJP: [
                    `皆さん、おはようございます。本日はお集まりいただきありがとうございます。私は${profile.name}、現在${profile.job}の${profile.position}を務めております。`,
                    `今期、私たちのチームは主要顧客との関係強化に注力してきました。現状について共有させてください。全体として着実に進捗しており、顧客満足度のスコアも前四半期からわずかに改善しています。`,
                    `とはいえ、まだ改善できる部分がいくつかあると考えています。これまでの学びを踏まえると、来期はすべての顧客に同じやり方を当てはめるのではなく、顧客ごとに合わせた柔軟なアプローチを優先すべきだと思います。`,
                    `以上が現状と今後注力すべき点の概要です。本日はお時間をいただきありがとうございました。ご質問があればぜひお聞かせください。`,
                ],
            };
        }

        // ---- Weekly教材（プレゼン教材と同じ仕組みの週替わり長文） ----
        function generateWeeklyMaterial() {
            return {
                week: 14,
                topic: '自分の強み・弱み・キャリアについて話す',
                paragraphsEN: [
                    "My strengths lie in two key areas: strategic planning based on data analysis and effective team leadership. In my current role as a marketing manager at an IT company, I utilize these skills every day. I have developed the ability to evaluate marketing campaigns quantitatively, which allows me to measure the success of different projects. By analyzing this data, I can swiftly implement strategies that drive better results. This analytical approach has helped my team to succeed in various projects and achieve high performance, contributing significantly to our company's objectives.",
                    "Another significant strength I possess is my communication ability. Communicating effectively with team members is crucial, and I excel in building cooperative relationships within my team. This skill not only creates a positive work environment but also enhances productivity as everyone is on the same page and can work towards common goals efficiently. My role often involves coordinating tasks and ensuring that everyone knows their responsibilities. This level of teamwork is essential for any successful marketing campaign, especially when working across global markets.",
                    "However, I do have a weakness, which is my tendency to focus too much on details. Sometimes, I can become so involved in the specifics of a project that I lose sight of the bigger picture. This focus can lead to challenges in making quick decisions, as I find myself deliberating over minor aspects instead of acting swiftly. Recognizing this, I am working on improving my decision-making skills to better balance detailed analysis with the need for timely actions.",
                    "Looking ahead, my career ambition is to become a global marketing director. I aim to lead my company's overseas expansion and develop brand strategies for diverse markets. Strengthening collaboration with international marketing teams and delivering a consistent global message are key aspects I am targeting. By applying my strengths in strategic analysis and leadership, while managing my attention to detail, I am confident in advancing my career and maximizing my company's global presence.",
                ],
                paragraphsJP: [
                    "私の強みは大きく2つあります。データ分析に基づく戦略立案と、効果的なチームリーダーシップです。現在IT企業でマーケティングマネージャーを務めており、日々この2つのスキルを活用しています。マーケティング施策を定量的に評価する力を培ってきたことで、各プロジェクトの成果を数値で測定できます。そのデータを分析することで、より良い結果につながる施策を素早く実行に移すことができます。この分析的なアプローチのおかげで、チームは様々なプロジェクトで成果を上げ、高いパフォーマンスを発揮し、会社の目標達成に大きく貢献してきました。",
                    "もう一つの強みはコミュニケーション能力です。チームメンバーと効果的にコミュニケーションを取ることは非常に重要で、私はチーム内で協力的な関係を築くことを得意としています。このスキルはポジティブな職場環境をつくるだけでなく、全員が同じ方向を向いて共通の目標に向かって効率的に動けるため、生産性の向上にもつながります。私の役割にはタスクの調整や、各メンバーが自分の責任範囲を理解できるようにすることも含まれます。こうしたチームワークは、特にグローバル市場を相手にする場合、マーケティング施策を成功させる上で欠かせません。",
                    "一方で、弱みとして、細部にこだわりすぎる傾向があります。プロジェクトの細かい部分に入り込みすぎて、全体像を見失ってしまうことがあります。この傾向のせいで、細かい点について悩みすぎてしまい、素早い意思決定が難しくなることがあります。この点を自覚し、詳細な分析と迅速な行動のバランスを取れるよう、意思決定力の向上に取り組んでいます。",
                    "今後のキャリアとしては、グローバルマーケティングディレクターになることを目指しています。会社の海外展開をリードし、多様な市場向けのブランド戦略を策定したいと考えています。海外のマーケティングチームとの連携を強化し、一貫したグローバルメッセージを発信することが、今目指している重要なポイントです。戦略分析力とリーダーシップという強みを活かしつつ、細部へのこだわりをうまくコントロールすることで、自信を持ってキャリアを前進させ、会社のグローバルでの存在感を最大化していきたいと思います。",
                ],
            };
        }

        // ---- Weeklyミッション 履歴（週ごとに1つの合否） ----
        const weeklyAssignmentResults = [];
        for (let w = 8; w >= 1; w--) {
            const monday = mondayOf(addDays(new Date(), -w * 7));
            weeklyAssignmentResults.push({ week: 14 - w, weekStart: monday, pass: Math.random() > 0.25 });
        }

        const WEEKLY_FEEDBACK_POOL = [
            { pass: true, comment: '内容の構成が明確で、強み・弱み・将来像がバランス良く伝わりました。' },
            { pass: true, comment: '話す速度がちょうど良く、聞き取りやすい発話でした。次はもう少し抑揚をつけてみましょう。' },
            { pass: false, comment: '内容は伝わりましたが、途中で言葉に詰まる箇所がありました。原稿をもう少し音読してから挑戦してみましょう。' },
        ];

        function ensureThisWeekAssignmentEntry() {
            const monday = mondayOf(new Date());
            let entry = weeklyAssignmentResults.find(w => w.weekStart.getTime() === monday.getTime());
            if (!entry) {
                entry = { week: weeklyAssignmentResults.length ? weeklyAssignmentResults[weeklyAssignmentResults.length - 1].week + 1 : 1, weekStart: monday, pass: false };
                weeklyAssignmentResults.push(entry);
            }
            return entry;
        }

        // ---- Dailyミッション（写真描写 / 質問回答の2種類） ----
        // ---- 動画（動画講座） ----
        const LECTURES = [
            { id: 'l1', title: 'ビジネス英語の基礎：メールの書き方', instructor: '田中コーチ', duration: '12:34', category: 'ライティング', color: '#1D4A73' },
            { id: 'l2', title: '会議で使える便利フレーズ集', instructor: '佐藤チューター', duration: '8:20', category: 'スピーキング', color: '#E8825F' },
            { id: 'l3', title: '発音矯正：LとRの違いを克服する', instructor: '田中コーチ', duration: '15:02', category: '発音', color: '#4CA98C' },
            { id: 'l4', title: 'プレゼンの構成：伝わる話し方の型', instructor: '佐藤チューター', duration: '10:47', category: 'スピーキング', color: '#8E4E9C' },
            { id: 'l5', title: 'ビジネスシーンの敬語表現まとめ', instructor: '田中コーチ', duration: '9:15', category: 'ライティング', color: '#4B5A68' },
        ];
        const LECTURE_SAMPLE_VIDEO = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
        let currentLecture = 'l1';
        let lectureWatched = new Set();

        const DAILY_MISSIONS = {
            photo: {
                label: '写真描写ミッション',
                prompt: 'Describe the picture below.',
                promptJP: '写真を見て、状況を英語で説明してください。',
                sampleEN: "This photo shows a busy open-plan office where several people are working at their desks. In the foreground, a woman is looking at her laptop screen while talking on the phone. Behind her, two colleagues appear to be discussing something in front of a whiteboard covered in sticky notes. The overall atmosphere looks focused but collaborative.",
                sampleJP: "この写真には、何人かがデスクで作業しているオープンオフィスが写っています。手前の女性はノートパソコンの画面を見ながら電話で話しています。その後ろでは、2人の同僚がふせんだらけのホワイトボードの前で何かを話し合っているようです。全体的に集中しつつも協力的な雰囲気が伝わってきます。",
            },
            question: {
                label: '質問回答ミッション',
                prompt: "What's one skill you'd like to improve this year, and why?",
                promptJP: '今年伸ばしたいスキルを1つ挙げるとしたら何ですか？その理由も教えてください。',
                sampleEN: "One skill I'd like to improve this year is public speaking. In my current role, I'm often asked to present ideas to senior stakeholders, and I sometimes feel less confident than I'd like when speaking in front of a large group. I think improving this skill would help me communicate my ideas more clearly and make a stronger impression in important meetings.",
                sampleJP: "今年伸ばしたいスキルは人前で話す力です。今の仕事では上層部にアイデアをプレゼンする機会が多いのですが、大人数の前で話すときに自信を持てないことがあります。このスキルを伸ばせば、自分の考えをより明確に伝えられ、重要な会議でより強い印象を残せると思います。",
            },
        };
        let currentDailyType = 'photo';
        let dailyTaskOrigin = 'output'; // 'output'（Dailyミッション選択）か 'freetraining'（フリー練習）
        let dailyMissionState = { phase: 'idle', seconds: 0, recTimer: null };

        const dailyMissionResults = [];
        for (let d = 10; d >= 1; d--) {
            const day = addDays(new Date(), -d);
            dailyMissionResults.push({ day: 99 - d, date: day, pass: Math.random() > 0.2, type: Math.random() > 0.5 ? 'photo' : 'question' });
        }

        function ensureTodayDailyEntry() {
            const today = new Date(); today.setHours(0, 0, 0, 0);
            let entry = dailyMissionResults.find(d => d.date.getTime() === today.getTime());
            if (!entry) {
                entry = { day: dailyMissionResults.length ? dailyMissionResults[dailyMissionResults.length - 1].day + 1 : 1, date: today, pass: false, type: currentDailyType };
                dailyMissionResults.push(entry);
            }
            return entry;
        }

        // ---- Monthlyミッション 履歴（月ごとに1つの合否） ----
        const monthlyMissionResults = [];
        for (let m = 6; m >= 1; m--) {
            const d = new Date(); d.setMonth(d.getMonth() - m, 1);
            monthlyMissionResults.push({ month: 8 - m, monthDate: d, pass: Math.random() > 0.2 });
        }

        function ensureThisMonthEntry() {
            const now = new Date();
            const first = new Date(now.getFullYear(), now.getMonth(), 1);
            let entry = monthlyMissionResults.find(m => m.monthDate.getTime() === first.getTime());
            if (!entry) {
                entry = { month: monthlyMissionResults.length ? monthlyMissionResults[monthlyMissionResults.length - 1].month + 1 : 1, monthDate: first, pass: false };
                monthlyMissionResults.push(entry);
            }
            return entry;
        }

        // ---- date helpers ----
        function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
        function mondayOf(d) { const x = new Date(d); const day = x.getDay(); const diff = (day === 0 ? -6 : 1 - day); x.setDate(x.getDate() + diff); x.setHours(0, 0, 0, 0); return x; }
        function shortMd(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
        function weekKey(d) { return shortMd(mondayOf(d)); }
        function monthKey(d) { return `${d.getFullYear()}/${d.getMonth() + 1}`; }

        // ---- records: daily study/speak minutes (personal & group) ----
        function buildDailyStats(days, studyBase, speakRatio) {
            const arr = [];
            for (let i = days - 1; i >= 0; i--) {
                const d = addDays(new Date(), -i);
                const study = Math.round(studyBase + (Math.random() * 40 - 15));
                const speak = Math.round(study * (speakRatio + Math.random() * 0.15));
                arr.push({ date: d, studyMin: Math.max(study, speak), speakMin: Math.min(speak, study) });
            }
            return arr;
        }
        const personalDailyStats = buildDailyStats(90, 80, 0.35);
        const groupDailyStatsRecords = buildDailyStats(90, 80 * 12, 0.35);

        const RECORD_GOALS = {
            personal: { study: 90, speak: 30 },
            group: { study: 90 * 12, speak: 30 * 12 },
        };

        let recordsView = { scope: 'personal', period: 'day', currentDay: new Date() };
        let recordsChartSelected = { day: null, week: null, month: null, all: 0 }; // null = default to most recent bar
        let recordsChartOffset = { day: 0, week: 0, month: 0, all: 0 }; // 0 = most recent window

        // ---- calendar tab: category options + per-day study log entries ----
        const STUDY_CATEGORIES = [
            { key: 'grammar', label: '文法', icon: 'input' },
            { key: 'listening', label: 'リスニング', icon: 'mic' },
            { key: 'speaking', label: 'スピーキング', icon: 'free' },
            { key: 'other', label: 'その他', icon: 'book' },
        ];
        const STUDY_SUBCATEGORIES = ['単語暗記', '文法問題', 'リスニング教材', 'シャドーイング', 'MYフレーズ復習', 'その他'];

        function dateKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

        const studyLogEntries = {};
        personalDailyStats.forEach(x => {

        function recordChartBuckets(scope, period, offset) {
            offset = offset || 0;
            const arr = scope === 'personal' ? personalDailyStats : groupDailyStatsRecords;
            const WINDOW = period === 'day' ? 7 : period === 'week' ? 6 : Infinity;

            if (period === 'day') {
                const daily = arr.map(x => ({ label: ['日', '月', '火', '水', '木', '金', '土'][x.date.getDay()], studyMin: x.studyMin, speakMin: x.speakMin, days: 1 }));
                const end = Math.max(0, daily.length - offset * WINDOW);
                const start = Math.max(0, end - WINDOW);
                return daily.slice(start, end);
            }
            if (period === 'week') {
                const map = {}; const order = [];
                arr.forEach(x => { const k = weekKey(x.date); if (!map[k]) { map[k] = { label: shortMd(mondayOf(x.date)), studyMin: 0, speakMin: 0, days: 0 }; order.push(k); } map[k].studyMin += x.studyMin; map[k].speakMin += x.speakMin; map[k].days++; });
                const all = order.map(k => map[k]);
                const end = Math.max(0, all.length - offset * WINDOW);
                const start = Math.max(0, end - WINDOW);
                return all.slice(start, end);
            }
            if (period === 'month') {
                const map = {};
                arr.forEach(x => { const k = monthKey(x.date); if (!map[k]) map[k] = { label: (x.date.getMonth() + 1) + '月', studyMin: 0, speakMin: 0, days: 0 }; map[k].studyMin += x.studyMin; map[k].speakMin += x.speakMin; map[k].days++; });
                return Object.values(map);
            }
            // all
            const total = arr.reduce((a, x) => ({ studyMin: a.studyMin + x.studyMin, speakMin: a.speakMin + x.speakMin }), { studyMin: 0, speakMin: 0 });
            return [{ label: '全期間', studyMin: total.studyMin, speakMin: total.speakMin, days: arr.length }];
        }

        const ASCENT_PATH = [{ x: 44, y: 392 }, { x: 104, y: 320 }, { x: 56, y: 238 }, { x: 132, y: 168 }, { x: 78, y: 96 }, { x: 150, y: 26 }];

        function pointAlongAscentPath(t) {
            t = Math.max(0, Math.min(1, t));
            const segs = ASCENT_PATH.length - 1;
            const scaled = t * segs;
            const i = Math.min(segs - 1, Math.floor(scaled));
            const lt = scaled - i;
            const a = ASCENT_PATH[i], b = ASCENT_PATH[i + 1];
            return { x: a.x + (b.x - a.x) * lt, y: a.y + (b.y - a.y) * lt };
        }

            const totalCount = recordChartTotalBuckets(scope, period);
            const WINDOW = period === 'day' ? 7 : period === 'week' ? 6 : Infinity;

        let history_stack = ['splash'];

            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function goTo(key, push = true) {
            let s = screens[key];
            if (!s) {
                // handle synthetic keys
                if (key === 'auth_signup') { state.authTab = 'signup'; key = 'auth'; s = screens.auth; }
                else if (key === 'auth_login') { state.authTab = 'login'; key = 'auth'; s = screens.auth; }
                else if (key === 'ob_start') { key = 'ob1'; s = screens.ob1; }
                else if (key === 'login_go_home') { state.profileComplete = true; history_stack = ['home']; key = 'home'; s = screens.home; }
                else if (key === 'onboard_finish') { state.profileComplete = true; history_stack = ['home']; key = 'home'; s = screens.home; }
            }
            if (!s) return;
            if (key === 'talk_call' && !talkCallState.active) startTalkCall();
            if (key !== 'talk_call' && talkCallState.active) endTalkCall(false);
            document.getElementById('screen').innerHTML = `<div class="fade">${s.html()}</div>`;
            document.getElementById('bottomnav').innerHTML = s.nav ? bottomNavHTML(s.nav) : '';
            document.getElementById('bottomnav').style.display = s.nav ? 'flex' : 'none';
            document.getElementById('screen').scrollTop = 0;
            if (key === 'presentation_material' || key === 'situational_dialogue' || key === 'weekly_material') {
                const wrap = document.getElementById('langSwipeWrap');
                if (wrap) {
                    const getState = () => key === 'situational_dialogue' ? dialogueLangPage : key === 'weekly_material' ? weeklyLangPage : presentationLangPage;
                    const setState = (v) => { if (key === 'situational_dialogue') dialogueLangPage = v; else if (key === 'weekly_material') weeklyLangPage = v; else presentationLangPage = v; };
                    wrap.scrollLeft = getState() * wrap.clientWidth;
                    wrap.addEventListener('scroll', () => {
                        const page = Math.round(wrap.scrollLeft / wrap.clientWidth);
                        if (page !== getState()) {
                            setState(page);
                            document.querySelectorAll('.langdots .dot').forEach((el, i) => el.classList.toggle('active', i === page));
                        }
                    });
                }
            }
            if (push) {
                if (history_stack[history_stack.length - 1] !== key) history_stack.push(key);
            }

        function formatCallTime(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function formatMin(min) {
            min = Math.round(min);
            if (min < 60) return `${min}分`;
            const h = Math.floor(min / 60), m = min % 60;
            return m === 0 ? `${h}時間` : `${h}時間${m}分`;

        function sendTalkMessage(threadKey) {

                return;
            }

            const chip = e.target.closest('[data-chip]');
            if (chip) {
                const [f, val] = chip.dataset.chip.split('|');
                profile[f] = val;
                // re-render current top of stack
                goTo(history_stack[history_stack.length - 1], false);
                return;
            }
            // quiz option pills (出題数 / 出題順) — single-select within their group
            const opt = e.target.closest('.opt');
            if (opt) {
                opt.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
                opt.classList.add('sel');
                return;
            }
            // MYフレーズ folder selection
            const folder = e.target.closest('.folder');
            if (folder && folder.parentElement.dataset.group === 'folder') {
                folder.parentElement.querySelectorAll('.folder').forEach(f => f.classList.remove('selected'));
                folder.classList.add('selected');
                return;
            }
            // generic toggle buttons (play / show-hide / learned)
            const toggle = e.target.closest('[data-toggle]');
            if (toggle) {
                toggle.classList.toggle('sel');
                return;
            }
            const action = e.target.closest('[data-action]');
            if (action) {
                const a = action.dataset.action;
                if (a === 'authtab-login') { state.authTab = 'login'; goTo('auth', false); return; }
                if (a === 'authtab-signup') { state.authTab = 'signup'; goTo('auth', false); return; }
                if (a === 'grant-mic') { state.permMic = true; goTo('obperm', false); return; }
                if (a === 'grant-speaker') { state.permSpeaker = true; goTo('obperm', false); return; }
                if (a === 'open-logout') { state.mypageLogoutOpen = true; goTo('mypage', false); return; }
                if (a === 'close-logout') { state.mypageLogoutOpen = false; goTo('mypage', false); return; }
                if (a === 'confirm-logout') {
                    state.mypageLogoutOpen = false;
                    state.authTab = 'login';
                    state.profileComplete = false;
                    history_stack = ['auth'];
                    goTo('auth', false);
                    return;
                }
            }
            const el = e.target.closest('[data-nav]');
            if (!el) return;
            const key = el.dataset.nav;
            if (el.dataset.thread) currentTalkThread = el.dataset.thread;
            if (el.dataset.member) currentMemberId = el.dataset.member;
            if (el.dataset.pastgroup !== undefined) currentPastGroupIdx = parseInt(el.dataset.pastgroup);
            if (el.dataset.folder) currentPhraseFolder = el.dataset.folder;
            if (el.dataset.lecture) currentLecture = el.dataset.lecture;
            if (el.dataset.dailytype) {
                currentDailyType = el.dataset.dailytype;
                dailyTaskOrigin = el.dataset.taskorigin || 'output';
                clearInterval(dailyMissionState.recTimer);
                dailyMissionState = { phase: 'idle', seconds: 0, recTimer: null };
            }
            if (el.dataset.scene) {
                currentScene = el.dataset.scene;
                clearInterval(players.dialogue.timer);
                players.dialogue = { playing: false, timer: null, elapsedMs: 0, speed: 1 };
                dialogueLangPage = 0;
                dialogueSlashLines = new Set();
            }
            if (key === 'dialogue_roleplay') dialogueRoleplayState = { phase: 'inprogress', lines: {} };
            if (key === 'presentation_practice') presentationPracticeState = { phase: 'idle', seconds: 0, recTimer: null };
            if (key === 'weekly_practice') weeklyPracticeState = { phase: 'idle', seconds: 0, recTimer: null, feedback: null };
            if (key === 'home') history_stack = ['home'];
            goTo(key, key !== 'home');
        });

        goTo('splash', false);
    </script>
</body>

</html>
