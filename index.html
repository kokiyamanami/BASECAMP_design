<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native App Prototype v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0B2338;
            --navy: #14365A;
            --navy-elev: #EEF1F4;
            --navy-card: #FFFFFF;
            --ice: #57677B;
            --muted: #8791A0;
            --white: #FFFFFF;
            --text: #0F2439;
            --accent: #E8825F;
            --accent-deep: #C25F3D;
            --pine: #3F7A5C;
            --line: rgba(15, 36, 57, .10);
            --danger: #D1573A;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #EDEFF3;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text);
        }

        .stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 32px 16px 64px;
        }

        .lab {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }

        .hint {
            max-width: 390px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .hint b {
            color: var(--accent);
        }

        .phone {
            width: 390px;
            max-width: 92vw;
            height: 844px;
            max-height: 88vh;
            background: var(--navy-elev);
            border-radius: 44px;
            border: 8px solid #030B14;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .04);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 26px;
            background: #030B14;
            border-radius: 0 0 16px 16px;
            z-index: 60;
        }

        .statusbar {
            height: 44px;
            flex: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 26px 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            position: relative;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .fade {
            animation: fadein .22s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topbar {
            padding: 2px 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }

        .topbar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .backbtn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(15, 36, 57, .06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
        }

        .backbtn svg {
            width: 15px;
            height: 15px;
            stroke: var(--text);
        }

        .screentitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .01em;
        }

        .mark {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--navy);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
        }

        .mark svg {
            width: 16px;
            height: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--navy-card);
            border: 1.5px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
        }

        .warnbanner {
            margin: 0 18px 14px;
            padding: 10px 13px;
            border-radius: 10px;
            background: rgba(225, 132, 107, .14);
            border: 1px solid rgba(225, 132, 107, .4);
            color: #A8432B;
            font-size: 11.5px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
        }

        .warnbanner svg {
            width: 16px;
            height: 16px;
            stroke: #A8432B;
            flex: none;
        }

        .warnbanner b {
            color: var(--text);
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 11.5px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0 18px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title a {
            color: var(--accent);
            font-size: 11px;
            letter-spacing: 0;
            text-transform: none;
            text-decoration: none;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }

        .card {
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .tap {
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
        }

        .tap:active {
            transform: scale(.97);
            background: var(--navy-elev);
        }

        /* HOME */
        .ascent-wrap {
            margin: 0 18px;
            padding: 20px 16px 16px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(150deg, #1D4A73, #0B2338);
            border-color: transparent;
        }

        .ascent-wrap .ridge-svg {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: auto;
        }

        .ascent-head {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .phase-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .14em;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
        }

        .phase-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 18px;
            font-weight: 900;
            margin-top: 4px;
            color: #FFFFFF;
        }

        .alt-now {
            text-align: right;
        }

        .alt-now .num {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .alt-now .unit {
            font-size: 9.5px;
            color: rgba(255, 255, 255, .55);
            letter-spacing: .08em;
        }

        .ascent-body {
            position: relative;
            z-index: 2;
            margin-top: 54px;
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            color: rgba(255, 255, 255, .65);
            font-family: 'Poppins', sans-serif;
            letter-spacing: .03em;
        }

        .quicktiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 18px;
        }

        .tile {
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .tile .ic {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: rgba(232, 130, 95, .15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile .ic svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
        }

        .tile .tl {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }

        .tile .sub {
            font-size: 9px;
            color: var(--muted);
        }

        .missioncard {
            margin: 0 18px;
            padding: 15px;
            display: flex;
            gap: 13px;
            align-items: center;
        }

        .missioncard .mi {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(145deg, var(--accent), var(--accent-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        .missioncard .mi svg {
            width: 20px;
            height: 20px;
            stroke: var(--navy-deep);
        }

        .missioncard .body {
            flex: 1;
        }

        .missioncard .ti {
            font-weight: 700;
            font-size: 13px;
        }

        .missioncard .de {
            font-size: 10.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .missioncard .go {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
        }

        .bottomnav {
            flex: none;
            height: 74px;
            background: var(--navy-card);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: flex-start;
            padding-top: 10px;
        }

        .navitem {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 9.5px;
            color: var(--muted);
            position: relative;
            cursor: pointer;
        }

        .navitem.active {
            color: var(--navy-deep);
        }

        .navitem.active svg {
            stroke: var(--accent);
        }

        .navitem svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .navitem .lockdot {
            position: absolute;
            top: -2px;
            right: 26%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--danger);
        }

        .navtooltip {
            position: absolute;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: var(--navy);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 10.5px;
            color: var(--white);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .35);
            z-index: 70;
        }

        .navtooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--accent);
        }

        .navtooltip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* UNIT MAP */
        .unitmap-wrap {
            position: relative;
            padding: 6px 0 30px;
        }

        .unitmap-ridge {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            z-index: 0;
            opacity: .5;
        }

        .unode-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 16px 0;
        }

        .unode {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            position: relative;
        }

        .unode.done {
            background: var(--pine);
            color: #E9F3EC;
        }

        .unode.current {
            background: var(--accent);
            color: var(--navy-deep);
            box-shadow: 0 0 0 5px rgba(232, 130, 95, .2);
            cursor: pointer;
        }

        .unode.locked {
            background: var(--navy-card);
            color: var(--muted);
            border: 1px solid var(--line);
        }

        .unode svg {
            width: 20px;
            height: 20px;
        }

        .ucaption {
            font-size: 9.5px;
            color: var(--muted);
            text-align: center;
            margin-top: 6px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: .03em;
        }

        .progresspill {
            margin-top: -12px;
            background: var(--navy-card);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 5px 13px;
            font-size: 9.5px;
            color: var(--accent);
            font-family: 'Poppins', sans-serif;
        }

        /* OUTPUT */
        .task-photo {
            margin: 0 18px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            height: 210px;
            background: linear-gradient(160deg, #1D4A73, #0B2338);
        }

        .task-photo .mesh {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 30% 20%, rgba(232, 130, 95, .16), transparent 60%);
        }

        .task-photo .cd {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(3, 11, 20, .65);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 5px 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 11.5px;
            color: var(--accent);
        }

        .task-photo .day {
            position: absolute;
            bottom: 12px;
            left: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .12em;
            color: rgba(255, 255, 255, .7);
            text-transform: uppercase;
        }

        .task-prompt {
            margin: 16px 18px 0;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.7;
        }

        .task-actions {
            margin: 20px 18px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .rec-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px -6px rgba(232, 130, 95, .45);
            cursor: pointer;
        }

        .rec-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--navy-deep);
        }

        .try-badge {
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .ghostbtn {
            border: 1px solid var(--line);
            color: var(--ice);
            font-size: 11.5px;
            padding: 8px 16px;
            border-radius: 20px;
            background: transparent;
            cursor: pointer;
        }

        .phrasebtn {
            margin: 18px 18px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--accent);
            border: 1px dashed rgba(232, 130, 95, .5);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }

        /* MY PHRASE */
        .folder-grid {
            padding: 0 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .folder {
            padding: 14px;
            position: relative;
        }

        .folder .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(232, 130, 95, .16);
            color: var(--accent);
            font-size: 9.5px;
            padding: 2px 7px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .folder .ti {
            font-weight: 700;
            font-size: 12px;
            margin-top: 16px;
            line-height: 1.4;
        }

        .folder .sub {
            font-size: 9.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .folder.selected {
            border-color: var(--accent);
        }

        .flash {
            margin: 16px 18px 0;
            padding: 24px 18px;
            text-align: center;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .flash .en {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .flash .jp {
            font-size: 11.5px;
            color: var(--muted);
        }

        .flash .rowbtns {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
        }

        .iconbtn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--navy-elev);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .iconbtn svg {
            width: 14px;
            height: 14px;
            stroke: var(--ice);
        }

        .iconbtn.sel {
            border-color: var(--accent);
            background: rgba(232, 130, 95, .15);
        }

        .iconbtn.sel svg {
            stroke: var(--accent);
        }

        .learned-btn {
            margin: 16px 18px 0;
            text-align: center;
            background: transparent;
            border: 1px solid var(--pine);
            color: #2C6B4A;
            padding: 10px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .learned-btn.sel {
            background: var(--pine);
            color: #0E1F17;
        }

        /* RECORDS */
        .goalring-row {
            display: flex;
            gap: 12px;
            padding: 0 18px;
        }

        .ringcard {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--pct, 70%), var(--line) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ring::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: var(--navy-card);
        }

        .ring span {
            position: relative;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .ringcard .lb {
            font-size: 10px;
            color: var(--muted);
            text-align: center;
        }

        .barchart {
            margin: 14px 18px 0;
            padding: 16px;
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 86px;
            margin-top: 14px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(180deg, var(--accent), var(--accent-deep));
            border-radius: 5px 5px 2px 2px;
        }

        .bar.low {
            background: var(--navy-elev);
        }

        .barlabels {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .barlabels span {
            flex: 1;
            text-align: center;
            font-size: 9px;
            color: var(--muted);
            font-family: 'Poppins', sans-serif;
        }

        .logrow {
            margin: 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            font-size: 11.5px;
        }

        .logrow .t {
            color: var(--muted);
            font-family: 'Poppins', sans-serif;
            font-size: 10.5px;
        }

        .logrow:last-child {
            border-bottom: none;
        }

        /* MYPAGE */
        .profile-hero {
            margin: 0 18px;
            padding: 22px 18px;
            text-align: center;
            position: relative;
        }

        .profile-hero .av {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--navy-elev);
            border: 2px solid var(--accent);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--text);
        }

        .profile-hero .nm {
            font-weight: 700;
            font-size: 14.5px;
        }

        .profile-hero .ph {
            font-size: 10.5px;
            color: var(--accent);
            margin-top: 4px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: .08em;
        }

        .fieldgroup {
            margin: 14px 18px 0;
            background: var(--navy-card);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
        }

        .fieldrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 16px;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
        }

        .fieldrow .k {
            color: var(--muted);
        }

        .fieldrow .v {
            font-weight: 600;
        }

        .fieldrow:last-child {
            border-bottom: none;
        }

        .cta-plan {
            margin: 20px 18px 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            color: var(--navy-deep);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .logoutrow {
            margin: 14px 18px 0;
            text-align: center;
            padding: 13px;
            border-radius: 12px;

        };

        let history_stack = ['splash'];

        function goTo(key, push = true) {
            let s = screens[key];
            if (!s) {
                // handle synthetic keys
                if (key === 'auth_signup') { state.authTab = 'signup'; key = 'auth'; s = screens.auth; }
                else if (key === 'auth_login') { state.authTab = 'login'; key = 'auth'; s = screens.auth; }
                else if (key === 'ob_start') { key = 'ob1'; s = screens.ob1; }
                else if (key === 'login_go_home') { state.profileComplete = true; history_stack = ['home']; key = 'home'; s = screens.home; }
                else if (key === 'onboard_finish') { state.profileComplete = true; history_stack = ['home']; key = 'home'; s = screens.home; }
            }
            if (!s) return;
            document.getElementById('screen').innerHTML = `<div class="fade">${s.html()}</div>`;
            document.getElementById('bottomnav').innerHTML = s.nav ? bottomNavHTML(s.nav) : '';
            document.getElementById('bottomnav').style.display = s.nav ? 'flex' : 'none';
            document.getElementById('statustitle').textContent = s.title || '';
            document.getElementById('screen').scrollTop = 0;
            if (push) {
                if (history_stack[history_stack.length - 1] !== key) history_stack.push(key);
            }
        }

        document.addEventListener('input', (e) => {
            const f = e.target.closest('[data-field]');
            if (f) {
                profile[f.dataset.field] = f.value;
                // keep the topbar avatar / mypage hero name in sync without losing input focus by not re-rendering here
            }
        });

        document.addEventListener('click', (e) => {
            const locked = e.target.closest('[data-locked]');
            if (locked) {
                const tip = locked.querySelector('.navtooltip');
                if (tip) {
                    tip.classList.add('show');
                    clearTimeout(tip._hideTimer);
                    tip._hideTimer = setTimeout(() => tip.classList.remove('show'), 1800);
                }
                return;
            }
            const chip = e.target.closest('[data-chip]');
            if (chip) {
                const [f, val] = chip.dataset.chip.split('|');
                profile[f] = val;
                // re-render current top of stack
                goTo(history_stack[history_stack.length - 1], false);
                return;
            }
            // quiz option pills (出題数 / 出題順) — single-select within their group
            const opt = e.target.closest('.opt');
            if (opt) {
                opt.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
                opt.classList.add('sel');
                return;
            }
            // MYフレーズ folder selection
            const folder = e.target.closest('.folder');
            if (folder && folder.parentElement.dataset.group === 'folder') {
                folder.parentElement.querySelectorAll('.folder').forEach(f => f.classList.remove('selected'));
                folder.classList.add('selected');
                return;
            }
            // generic toggle buttons (play / show-hide / learned)
            const toggle = e.target.closest('[data-toggle]');
            if (toggle) {
                toggle.classList.toggle('sel');
                return;
            }
            const action = e.target.closest('[data-action]');
            if (action) {
                const a = action.dataset.action;
                if (a === 'authtab-login') { state.authTab = 'login'; goTo('auth', false); return; }
                if (a === 'authtab-signup') { state.authTab = 'signup'; goTo('auth', false); return; }
                if (a === 'grant-mic') { state.permMic = true; goTo('obperm', false); return; }
                if (a === 'grant-speaker') { state.permSpeaker = true; goTo('obperm', false); return; }
                if (a === 'open-logout') { state.mypageLogoutOpen = true; goTo('mypage', false); return; }
                if (a === 'close-logout') { state.mypageLogoutOpen = false; goTo('mypage', false); return; }
                if (a === 'confirm-logout') {
                    state.mypageLogoutOpen = false;
                    state.authTab = 'login';
                    state.profileComplete = false;
                    history_stack = ['auth'];
                    goTo('auth', false);
                    return;
                }
            }
            const el = e.target.closest('[data-nav]');
            if (!el) return;
            const key = el.dataset.nav;
            if (key === 'home') history_stack = ['home'];
            goTo(key, key !== 'home');
        });

        goTo('splash', false);
    </script>
</body>
